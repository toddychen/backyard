image:
  repository: mysql
  tag: "9"
  pullPolicy: IfNotPresent

service:
  port: 3306
  # NodePort for direct access from host (e.g. local dev profile)
  nodePort: 30306

database: playground
user: playground
# Override in values-kind.yaml — never commit real passwords here
password: ""
rootPassword: ""
collabPassword: ""

dataHostPath: ""

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
