apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-datasources
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # Grafana auto-provisions datasources from files in
  # /etc/grafana/provisioning/datasources/ on startup.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.observability:3100
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.observability:16686
