replicas: 1

image:
  repository: collab
  tag: dev
  pullPolicy: Never

service:
  type: ClusterIP
  port: 2070
  nodePort: ""

redisHost: ""
redisPort: "6379"

databaseUrl: ""

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 500m

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5
