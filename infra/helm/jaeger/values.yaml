image:
  repository: jaegertracing/jaeger
  tag: "2.16.0"
  pullPolicy: IfNotPresent

service:
  # UI — accessible from the host browser via Kind extraPortMappings
  uiPort: 16686
  uiNodePort: 30686
  # OTLP HTTP — used by playground pods inside the cluster
  otlpPort: 4318
  # OTLP gRPC — available but not used by default
  otlpGrpcPort: 4317

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 200m
