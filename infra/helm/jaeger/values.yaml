image:
  repository: jaegertracing/jaeger
  tag: "2.16.0"
  pullPolicy: IfNotPresent

service:
  # UI and query API — same port serves both. Accessible from the host
  # browser via Kind extraPortMappings. Grafana also queries this port
  # internally (http://jaeger.observability:16686) to fetch trace data.
  uiPort: 16686
  uiNodePort: 30686
  # OTLP HTTP — used by playground pods inside the cluster; NodePort for local jar
  otlpPort: 4318
  otlpNodePort: 30318
  # OTLP gRPC — available but not used by default
  otlpGrpcPort: 4317

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 200m
