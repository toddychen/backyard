apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.springProfile }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
            {{- end }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: CASSANDRA_CONTACT_POINTS
              value: {{ .Values.cassandra.contactPoints | quote }}
            - name: CASSANDRA_PORT
              value: {{ .Values.cassandra.port | quote }}
            - name: CASSANDRA_KEYSPACE
              value: {{ .Values.cassandra.keyspace | quote }}
            - name: CASSANDRA_LOCAL_DC
              value: {{ .Values.cassandra.localDc | quote }}
          # No HTTP probes — this is a headless worker service with no web layer.
          # Kubernetes restarts the pod if the JVM process exits with a non-zero code.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
