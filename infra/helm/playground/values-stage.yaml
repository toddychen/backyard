# Stage environment on GCP (Argo CD syncs this)
# Update image.tag to the desired git SHA to promote or revert.

replicas: 1

image:
  repository: ghcr.io/toddychen/service-playground
  tag: "30bac101e22843ba9e82b62eb38590ce9d6d6711" # Set to git SHA for promote; set to previous SHA to revert
  pullPolicy: Always

springProfile: stage
gcpProjectId: backyard-490700

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: "gce"
  hosts:
    - host: ""  # Set stage hostname, e.g. playground-stage.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
