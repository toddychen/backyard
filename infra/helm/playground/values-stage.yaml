# Stage environment on GCP (Argo CD syncs this)
# Update image.tag to the desired git SHA to promote or revert.

replicas: 1

image:
  repository: ghcr.io/toddychen/service-playground
  tag: "cc90cca5c032f46d6df6042f8dd3c0a962f0b562" # Set to git SHA for promote; set to previous SHA to revert
  pullPolicy: Always

springProfile: stage
gcpProjectId: backyard-490700

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: "gce"
  hosts:
    - host: ""  # Set stage hostname, e.g. playground-stage.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
