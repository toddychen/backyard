replicas: 1

image:
  repository: playground
  tag: dev
  pullPolicy: Never

springProfile: dev

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 90
  periodSeconds: 10

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 60
  periodSeconds: 5

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

