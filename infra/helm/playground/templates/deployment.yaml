apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Prometheus pod discovery — scrape /actuator/prometheus on port 8080
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.springProfile }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
            {{- end }}
            {{- if .Values.gcpProjectId }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.gcpProjectId | quote }}
            {{- end }}
            {{- if .Values.redisHost }}
            - name: REDIS_HOST
              value: {{ .Values.redisHost | quote }}
            {{- end }}
            {{- if .Values.redisPort }}
            - name: REDIS_PORT
              value: {{ .Values.redisPort | quote }}
            {{- end }}
            {{- if .Values.otlpEndpoint }}
            - name: OTEL_TRACING_ENABLED
              value: "true"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: {{ .Values.otlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.tracingSamplingProbability }}
            - name: TRACING_SAMPLING_PROBABILITY
              value: {{ .Values.tracingSamplingProbability | quote }}
            {{- end }}
            {{- if .Values.jwtSecret }}
            - name: AUTH_JWT_SECRET
              value: {{ .Values.jwtSecret | quote }}
            {{- end }}
            {{- if .Values.h2DbUrl }}
            - name: H2_DB_URL
              value: {{ .Values.h2DbUrl | quote }}
            {{- end }}
            {{- if .Values.mysqlHost }}
            - name: MYSQL_URL
              value: "jdbc:mysql://{{ .Values.mysqlHost }}:{{ .Values.mysqlPort }}/{{ .Values.mysqlDb }}"
            - name: MYSQL_USER
              value: {{ .Values.mysqlUser | quote }}
            - name: MYSQL_PASSWORD
              value: {{ .Values.mysqlPassword | quote }}
            {{- end }}
          {{- if .Values.h2DataMount }}
          volumeMounts:
            - name: h2-data
              mountPath: /data
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.h2DataMount }}
      volumes:
        - name: h2-data
          hostPath:
            path: {{ .Values.h2HostPath }}
            type: DirectoryOrCreate
      {{- end }}
