# Prod environment on GCP (Argo CD syncs this)
# Update image.tag to the desired git SHA to promote or revert.

replicas: 2

image:
  repository: ghcr.io/toddychen/service-playground
  tag: "9e198b20edce2fa572eb17b8f84f50a1b9d566e1" # Set to git SHA for promote; set to previous SHA to revert
  pullPolicy: Always

# prod profile → logback uses !dev → JSON logs, INFO level
springProfile: prod
gcpProjectId: backyard-490700

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: "gce"
  hosts:
    - host: ""  # Set prod hostname, e.g. playground.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
