# Prod environment on GCP (Argo CD syncs this)
# Update image.tag to the desired git SHA to promote or revert.

replicas: 2

image:
  repository: ghcr.io/toddychen/service-playground
  tag: "9b98cd2d4df490b7ab74b1b20721690b9a3265d7" # Set to git SHA for promote; set to previous SHA to revert
  pullPolicy: Always

# prod profile → logback uses !dev → JSON logs, INFO level
springProfile: prod

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: "gce"
  hosts:
    - host: ""  # Set prod hostname, e.g. playground.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
