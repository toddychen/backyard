# Prod environment on GCP (Argo CD syncs this)
# Update image.tag to the desired git SHA to promote or revert.

replicas: 2

image:
  repository: ghcr.io/toddychen/service-playground
  tag: "f826a4ec4a87d35b19d76795a7d3e27beb41ebb5" # Set to git SHA for promote; set to previous SHA to revert
  pullPolicy: Always

springProfile: prod
gcpProjectId: backyard-490700

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: "gce"
  hosts:
    - host: ""  # Set prod hostname, e.g. playground.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
