replicas: 2

# Explicit profile prevents accidental activation of application-dev.properties
springProfile: kind

image:
  repository: ghcr.io/<username>/service-playground
  tag: <git-sha>
  # For kind dev, GHCR public images can be pulled anonymously.
  # If you later switch to private images, we'll re-enable imagePullSecrets.
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  # Fix NodePort for stable local access (30000-32767 by default).
  nodePort: 30001

ingress:
  enabled: false

# Jaeger runs in the observability namespace — send traces there in-cluster
otlpEndpoint: http://jaeger.observability:4318/v1/traces
tracingSamplingProbability: "1.0"

# Redis runs in the redis namespace — connect via internal service DNS
redisHost: redis.redis
redisPort: "6379"

# H2 — persisted to host machine via hostPath volume
h2DbUrl: "jdbc:h2:file:/data/h2-kind"
h2DataMount: true
h2HostPath: "/Users/toddy/.backyard"

# MySQL — connects to mysql.mysql (in-cluster service)
# JWT signing secret — min 32 chars for HS256
jwtSecret: kind-secret-for-local-use-only-padding

# MySQL — connects to mysql.mysql (in-cluster service)
mysqlHost: mysql.mysql
mysqlPort: "3306"
mysqlDb: playground
mysqlUser: playground
mysqlPassword: playground-kind
