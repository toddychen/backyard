apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  # Promtail queries the Kubernetes API to attach pod metadata
  # labels (namespace, pod name, container name) to log streams.
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
    verbs: [get, list, watch]
