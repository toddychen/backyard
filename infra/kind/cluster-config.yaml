kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: backyard-kind
nodes:
  - role: control-plane
    extraPortMappings:
      # playground service (NodePort)
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      # Jaeger UI
      - containerPort: 30686
        hostPort: 30686
        protocol: TCP
      # Jaeger OTLP HTTP (local jar sends traces here)
      - containerPort: 30318
        hostPort: 30318
        protocol: TCP
      # Redis (redis-cli from host)
      - containerPort: 30379
        hostPort: 30379
        protocol: TCP
      # MySQL (local dev profile connects to kind cluster)
      - containerPort: 30306
        hostPort: 30306
        protocol: TCP
      # Grafana UI
      - containerPort: 30030
        hostPort: 30030
        protocol: TCP
      # Prometheus UI
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
  - role: worker
  - role: worker

