kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: backyard-kind
nodes:
  - role: control-plane
    extraPortMappings:
      # playground REST (NodePort)
      - containerPort: 32080
        hostPort: 32080
        protocol: TCP
      # playground gRPC (NodePort)
      - containerPort: 32090
        hostPort: 32090
        protocol: TCP
      # playground service (NodePort)
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      # Jaeger UI
      - containerPort: 30686
        hostPort: 30686
        protocol: TCP
      # Jaeger OTLP HTTP (local jar sends traces here)
      - containerPort: 30318
        hostPort: 30318
        protocol: TCP
      # Redis (redis-cli from host)
      - containerPort: 30379
        hostPort: 30379
        protocol: TCP
      # MySQL (local dev profile connects to kind cluster)
      - containerPort: 30306
        hostPort: 30306
        protocol: TCP
      # Cassandra (cqlsh from host, local dev profile)
      - containerPort: 30942
        hostPort: 30942
        protocol: TCP
      # Kafka (producer/consumer from host, local dev profile)
      - containerPort: 30092
        hostPort: 30092
        protocol: TCP
      # Kafka UI
      - containerPort: 30880
        hostPort: 30880
        protocol: TCP
      # Grafana UI
      - containerPort: 30030
        hostPort: 30030
        protocol: TCP
      # Prometheus UI
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      # collab service
      - containerPort: 32070
        hostPort: 32070
        protocol: TCP
  - role: worker
    extraMounts:
      - hostPath: /Users/toddy/.backyard
        containerPath: /Users/toddy/.backyard
  - role: worker
    extraMounts:
      - hostPath: /Users/toddy/.backyard
        containerPath: /Users/toddy/.backyard

