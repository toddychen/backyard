# CI profile — used by GitHub Actions tests against service containers.

# JWT signing secret — min 32 chars for HS256
auth.jwt.secret=ci-secret-for-testing-use-only-padding

# H2
h2.url=jdbc:h2:file:./target/h2-ci

# MySQL — GitHub Actions service container (standard port)
mysql.url=jdbc:mysql://localhost:3306/playground
mysql.username=playground
mysql.password=playground-ci

# Redis — GitHub Actions service container (standard port)
spring.data.redis.host=localhost
spring.data.redis.port=6379
