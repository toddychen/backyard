server.port=${SERVER_PORT:8080}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.application.name=playground

# GCP project ID (used for Secret Manager in stage/prod)
gcp.project-id=${GCP_PROJECT_ID:}

# H2 file-based DB for dory reminders
spring.datasource.url=${DORY_DB_URL:jdbc:h2:file:./data/dory}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Health groups
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# Resilience4j — circuit breaker
# Circuit breaker instances are keyed as "<client>-<methodName>"
# (e.g. yahoosports-getTeamGames), giving each endpoint independent
# breaker state. minimum-number-of-calls overrides the default
# of 100, which is too high for low-volume external clients.
resilience4j.circuitbreaker.instances.ambee-getLatestPollen.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ambee-getLatestPollen.sliding-window-size=10
resilience4j.circuitbreaker.instances.ambee-getLatestPollen.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.yahoosports-getTeamGames.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.yahoosports-getTeamGames.sliding-window-size=10
resilience4j.circuitbreaker.instances.yahoosports-getTeamGames.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.yahoosports-getGameDetails.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.yahoosports-getGameDetails.sliding-window-size=10
resilience4j.circuitbreaker.instances.yahoosports-getGameDetails.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.google-getForecast.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.google-getForecast.sliding-window-size=10
resilience4j.circuitbreaker.instances.google-getForecast.wait-duration-in-open-state=30s

# Resilience4j — retry with exponential backoff + jitter
resilience4j.retry.instances.ambee.max-attempts=3
resilience4j.retry.instances.ambee.wait-duration=500ms
resilience4j.retry.instances.ambee.enable-exponential-backoff=true
resilience4j.retry.instances.ambee.exponential-backoff-multiplier=2
resilience4j.retry.instances.ambee.randomized-wait-factor=0.5
resilience4j.retry.instances.yahoosports.max-attempts=3
resilience4j.retry.instances.yahoosports.wait-duration=500ms
resilience4j.retry.instances.yahoosports.enable-exponential-backoff=true
resilience4j.retry.instances.yahoosports.exponential-backoff-multiplier=2
resilience4j.retry.instances.yahoosports.randomized-wait-factor=0.5
resilience4j.retry.instances.google.max-attempts=3
resilience4j.retry.instances.google.wait-duration=500ms
resilience4j.retry.instances.google.enable-exponential-backoff=true
resilience4j.retry.instances.google.exponential-backoff-multiplier=2
resilience4j.retry.instances.google.randomized-wait-factor=0.5

# Tracing
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.0}
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.enabled=${OTEL_TRACING_ENABLED:false}
# Endpoint is not declared here — Spring Boot maps the env var
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT directly.
# An empty string default causes "Invalid endpoint" at startup.
