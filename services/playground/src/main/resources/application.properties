server.port=8080
spring.application.name=playground

# GCP project ID (used for Secret Manager in stage/prod)
gcp.project-id=${GCP_PROJECT_ID:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Health groups
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# OTLP export is off by default — enable in stage/prod where a collector exists
management.opentelemetry.metrics.export.enabled=false
management.opentelemetry.tracing.export.enabled=false

