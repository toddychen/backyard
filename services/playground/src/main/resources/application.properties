server.port=8080

# Redis — overridden per environment (dev: application-dev.properties, stage/prod: Helm values)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.application.name=playground

# GCP project ID (used for Secret Manager in stage/prod)
gcp.project-id=${GCP_PROJECT_ID:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Health groups
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# OTLP export is off by default — enable in stage/prod where a collector exists
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.enabled=false

