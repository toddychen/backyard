server.port=${SERVER_PORT:8080}
grpc.server.port=${GRPC_PORT:9090}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.application.name=playground
spring.messages.basename=i18n/messages

# GCP project ID (used for Secret Manager in stage/prod)
gcp.project-id=${GCP_PROJECT_ID:}

# MySQL auth DB (users, refresh tokens)
# URL and username are non-sensitive — set per profile/env var.
# Password is injected by SecretManagerLoader (non-dev) or
# application-dev.properties (dev).
mysql.url=${MYSQL_URL:jdbc:mysql://localhost:30306/playground}
mysql.username=${MYSQL_USER:playground}
mysql.password=${MYSQL_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Health groups
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# Resilience4j — circuit breaker
# Instances are keyed as "<client>-<methodName>" (e.g. google_pollen-getForecast),
# giving each endpoint independent breaker state.
# Resilience4j defaults: minimum-number-of-calls=100, sliding-window-size=100,
# wait-duration-in-open-state=60s, failure-rate-threshold=50%.
resilience4j.circuitbreaker.instances.google_pollen-getForecast.minimum-number-of-calls=100
resilience4j.circuitbreaker.instances.google_pollen-getForecast.sliding-window-size=100
resilience4j.circuitbreaker.instances.google_pollen-getForecast.wait-duration-in-open-state=60s

# Resilience4j — retry with exponential backoff + jitter
# Resilience4j defaults: max-attempts=3, wait-duration=500ms, no backoff.
resilience4j.retry.instances.google_pollen.max-attempts=3
resilience4j.retry.instances.google_pollen.wait-duration=500ms
resilience4j.retry.instances.google_pollen.enable-exponential-backoff=true
resilience4j.retry.instances.google_pollen.exponential-backoff-multiplier=2
resilience4j.retry.instances.google_pollen.randomized-wait-factor=0.5

# Cassandra — notification keyspace
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:cassandra}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:notification}
spring.cassandra.local-datacenter=${CASSANDRA_LOCAL_DC:datacenter1}

# Kafka — notification fan-out trigger endpoint producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-0.kafka.kafka.svc.cluster.local:9092}

# Virtual threads
spring.threads.virtual.enabled=true

# Tracing
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.0}

# Suppress all Spring Security spans — every inbound request runs through
# the security filter chain regardless of permitAll/authenticated rules,
# producing spans (filterchains, authorize request, secured request) that
# add no business context. Disable all to keep traces focused on app logic.
management.observations.enable.spring.security=false
# Disable OTLP push for metrics — metrics are exposed via /actuator/prometheus
# for Prometheus pull-based scraping instead.
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.enabled=${OTEL_TRACING_ENABLED:false}
# Endpoint is not declared here — Spring Boot maps the env var
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT directly.
# An empty string default causes "Invalid endpoint" at startup.

# Google Cloud Natural Language API key
# Dev: set GOOGLE_LANGUAGE_API_KEY env var (e.g. in fish config.fish)
# Stage/prod: loaded from GCP Secret Manager by SecretManagerLoader
google.language.api-key=${GOOGLE_LANGUAGE_API_KEY:}

# Springdoc OpenAPI — spec at /v3/api-docs, UI at /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.backyard.playground.server.rest.controller
