server.port=${SERVER_PORT:8080}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.application.name=playground
spring.messages.basename=i18n/messages

# GCP project ID (used for Secret Manager in stage/prod)
gcp.project-id=${GCP_PROJECT_ID:}

# H2 file-based DB for dory reminders
spring.datasource.url=${DORY_DB_URL:jdbc:h2:file:./data/dory}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=2

# MySQL auth DB (users, refresh tokens)
# URL and username are non-sensitive — set per profile/env var.
# Password is injected by SecretManagerLoader (non-dev) or
# application-dev.properties (dev).
auth.mysql.url=${MYSQL_URL:jdbc:mysql://localhost:30306/playground}
auth.mysql.username=${MYSQL_USER:playground}
auth.mysql.password=${MYSQL_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Health groups
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# Resilience4j — circuit breaker
# Circuit breaker instances are keyed as "<client>-<methodName>"
# (e.g. yahoosports-getTeamGames), giving each endpoint independent
# breaker state. minimum-number-of-calls overrides the default
# of 100, which is too high for low-volume external clients.
resilience4j.circuitbreaker.instances.ambee-getLatestPollen.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ambee-getLatestPollen.sliding-window-size=10
resilience4j.circuitbreaker.instances.ambee-getLatestPollen.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.yahoo_sports-getTeamGames.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.yahoo_sports-getTeamGames.sliding-window-size=10
resilience4j.circuitbreaker.instances.yahoo_sports-getTeamGames.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.yahoo_sports-getGameDetails.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.yahoo_sports-getGameDetails.sliding-window-size=10
resilience4j.circuitbreaker.instances.yahoo_sports-getGameDetails.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.google_pollen-getForecast.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.google_pollen-getForecast.sliding-window-size=10
resilience4j.circuitbreaker.instances.google_pollen-getForecast.wait-duration-in-open-state=30s

# Resilience4j — retry with exponential backoff + jitter
resilience4j.retry.instances.ambee.max-attempts=3
resilience4j.retry.instances.ambee.wait-duration=500ms
resilience4j.retry.instances.ambee.enable-exponential-backoff=true
resilience4j.retry.instances.ambee.exponential-backoff-multiplier=2
resilience4j.retry.instances.ambee.randomized-wait-factor=0.5
resilience4j.retry.instances.yahoo_sports.max-attempts=3
resilience4j.retry.instances.yahoo_sports.wait-duration=500ms
resilience4j.retry.instances.yahoo_sports.enable-exponential-backoff=true
resilience4j.retry.instances.yahoo_sports.exponential-backoff-multiplier=2
resilience4j.retry.instances.yahoo_sports.randomized-wait-factor=0.5
resilience4j.retry.instances.google_pollen.max-attempts=3
resilience4j.retry.instances.google_pollen.wait-duration=500ms
resilience4j.retry.instances.google_pollen.enable-exponential-backoff=true
resilience4j.retry.instances.google_pollen.exponential-backoff-multiplier=2
resilience4j.retry.instances.google_pollen.randomized-wait-factor=0.5

# Tracing
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.0}
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.enabled=${OTEL_TRACING_ENABLED:false}
# Endpoint is not declared here — Spring Boot maps the env var
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT directly.
# An empty string default causes "Invalid endpoint" at startup.

# Springdoc OpenAPI — spec at /v3/api-docs, UI at /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.backyard.playground.controller
