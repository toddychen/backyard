# Home profile — lightweight long-running jar on local network.
# No Redis, no tracing. Just serves APIs from a stable pre-built jar.
# Run with: java -jar playground.jar --spring.profiles.active=home

server.port=3100

# H2 — separate file from dev to avoid locking conflicts
h2.url=jdbc:h2:file:${user.home}/.backyard/h2-home

# Dependencies for Redis and OpenTelemetry are on the classpath (needed by
# other profiles) so Spring Boot auto-configures them regardless. These
# excludes prevent startup failures when neither is available at home.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Tracing — base defaults OTEL_TRACING_ENABLED=false and
# TRACING_SAMPLING_PROBABILITY=0.0 already disable tracing.
# Explicitly set here for clarity.
management.tracing.sampling.probability=0.0
management.opentelemetry.tracing.export.enabled=false

# Metrics — disable Prometheus scraping endpoint, no monitoring infra at home
management.otlp.metrics.export.enabled=false
management.endpoints.web.exposure.include=health
