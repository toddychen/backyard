server.port=2000

# Log cache hits/misses per request — dev only, no-op in stage/prod
cache.diagnostic.enabled=true

# When set to DEBUG, this logger prints a verbose auto-configuration report
# (useful for troubleshooting) that is too noisy for daily dev. Keep INFO;
# temporarily switch to DEBUG when needed.
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=INFO

# Suppress DEBUG logs from Spring MVC's response-writing internals — too noisy.
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO

# RestClient logs all outbound request/response details at DEBUG level
# (method, URI, status, headers, body). Covers all three HTTP clients.
logging.level.org.springframework.web.client.RestClient=DEBUG

# Allows JDK HTTP client JUL records to pass through the JUL-to-SLF4J
# bridge. Without this, JUL's default INFO level drops the records before
# they reach logback. The system property in the run script activates
# what the JDK client emits; this controls what the bridge forwards.
logging.level.jdk.internal.net.http=DEBUG

# OTLP tracing — enabled in dev, pointing at Jaeger.
# When running locally: Jaeger must be reachable at localhost:4318
#   (e.g. via: kubectl -n observability port-forward svc/jaeger 4318:4318)
# When running in Kind: MANAGEMENT_OTLP_TRACING_ENDPOINT env var overrides
#   this to http://jaeger.observability:4318/v1/traces automatically.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces


