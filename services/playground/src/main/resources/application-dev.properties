server.port=2080
grpc.server.port=2090

# H2 at a fixed home-relative path — predictable across restarts
h2.url=jdbc:h2:file:${user.home}/.backyard/h2-dev

# MySQL — kind cluster NodePort exposed locally
mysql.url=jdbc:mysql://localhost:30306/playground
mysql.username=playground
mysql.password=playground-kind

# JWT signing secret — min 32 chars for HS256
# Dev-only: non-dev profiles load this from GCP Secret Manager
auth.jwt.secret=dev-secret-for-local-use-only-padding

# Redis — Kind cluster NodePort exposed locally
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:30379}

# Cassandra — Kind cluster NodePort exposed locally
spring.cassandra.contact-points=127.0.0.1
spring.cassandra.port=30942
spring.cassandra.request.timeout=30s
spring.cassandra.connection.init-query-timeout=30s

# Tracing — send to Jaeger NodePort exposed from the Kind cluster
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:30318/v1/traces}

# Suppress verbose auto-configuration report — switch to DEBUG when needed
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=INFO

# Suppress DEBUG logs from Spring MVC response-writing internals
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO

# RestClient logs all outbound request/response details at DEBUG level
logging.level.org.springframework.web.client.RestClient=DEBUG

# Allows JDK HTTP client JUL records to pass through the JUL-to-SLF4J bridge
logging.level.jdk.internal.net.http=DEBUG
