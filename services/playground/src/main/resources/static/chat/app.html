<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backyard Chat</title>
  <link rel="stylesheet" href="/chat/style.css">
</head>
<body class="app-page">

  <div class="app-layout">

    <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="workspace-name">Backyard</span>
        <div class="current-user-row">
          <div id="current-user-avatar" class="avatar avatar-sm"></div>
          <span id="current-user-name" class="current-user"></span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <section class="nav-section">
          <div class="nav-section-header">
            <span>Channels</span>
            <div style="display:flex;gap:4px">
              <button class="icon-btn" id="browse-channel-btn" title="Browse channels">⊞</button>
              <button class="icon-btn" id="new-channel-btn" title="New channel">+</button>
            </div>
          </div>
          <ul id="channel-list" class="nav-list"></ul>
        </section>

        <section class="nav-section">
          <div class="nav-section-header">
            <span>Direct Messages</span>
            <button class="icon-btn" id="new-dm-btn" title="New DM">+</button>
          </div>
          <ul id="dm-list" class="nav-list"></ul>
        </section>
      </nav>

      <div class="sidebar-footer">
        <button id="sign-out-btn" class="sign-out-btn">Sign out</button>
      </div>
    </aside>

    <!-- ── Main content ────────────────────────────────────────────────────── -->
    <main class="main-content">
      <div id="empty-state" class="empty-state">
        Select a channel or DM to start chatting
      </div>

      <div id="channel-view" class="channel-view hidden">
        <header class="channel-header">
          <span id="channel-header-prefix" class="channel-prefix">#</span>
          <span id="channel-header-name"></span>
        </header>

        <div id="message-list" class="message-list"></div>

        <div class="message-input-area">
          <form id="message-form">
            <input type="text" id="message-input" placeholder="Message…"
                   autocomplete="off" maxlength="4000">
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- ── Browse channels modal ────────────────────────────────────────────── -->
  <div id="browse-channel-modal" class="modal hidden">
    <div class="modal-box" style="width:420px">
      <h3>Browse Channels</h3>
      <div id="browse-channel-list"
           style="max-height:300px;overflow-y:auto;margin-bottom:16px;"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-browse-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- ── New channel modal ─────────────────────────────────────────────────── -->
  <div id="new-channel-modal" class="modal hidden">
    <div class="modal-box">
      <h3>Create Channel</h3>
      <form id="new-channel-form">
        <input type="text" id="channel-name-input" placeholder="e.g. general"
               maxlength="64" required autocomplete="off">
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancel-channel-btn">Cancel</button>
          <button type="submit">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── New DM modal ──────────────────────────────────────────────────────── -->
  <div id="new-dm-modal" class="modal hidden">
    <div class="modal-box">
      <h3>New Direct Message</h3>
      <div id="dm-user-list" style="max-height:240px;overflow-y:auto;margin-bottom:16px;"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-dm-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/chat/utils.js"></script>
  <script src="/chat/app.js"></script>
</body>
</html>
