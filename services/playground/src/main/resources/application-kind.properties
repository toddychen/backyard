# Kind cluster profile — used when deployed as a pod in Kind.
# Uses JSON logging (logstash-logback-encoder) so Loki can parse
# structured fields. Local jar dev uses the 'dev' profile instead.

server.port=8080

# Redis — in-cluster DNS, overridden by Helm env vars
spring.data.redis.host=${REDIS_HOST:redis.redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Tracing — send to Jaeger in-cluster
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=false
management.opentelemetry.tracing.export.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://jaeger.observability:4318/v1/traces}
