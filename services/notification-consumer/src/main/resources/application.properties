spring.application.name=notification-consumer

# Virtual threads
spring.threads.virtual.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=notification-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.backyard.notification.common.kafka.message
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# 4 listener threads per consumer — 2 pods x 4 = 8 total, 2 partitions each
spring.kafka.listener.concurrency=4

# Cassandra
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:cassandra}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:notification}
spring.cassandra.local-datacenter=${CASSANDRA_LOCAL_DC:datacenter1}
spring.cassandra.request.timeout=10s
