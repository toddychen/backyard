<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Critical Reminder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
        }

        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            border: 5px solid rgba(239, 68, 68, 0.6);
            border-radius: 12px;
            padding: 2rem 2.5rem;
            pointer-events: auto;
            width: 100%;
            box-sizing: border-box;
            animation: glowPulse 1s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            from { border-color: rgba(239, 68, 68, 0.2); }
            to   { border-color: rgba(239, 68, 68, 1); }
        }

        .title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            margin: 0 0 0.6rem 0;
            text-align: center;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .countdown {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: #ef4444;
            margin: 1.5rem 0 0.4rem 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scheduled {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.85rem;
            color: #a1a1aa;
            margin: 0 0 0.2rem 0;
            text-align: center;
        }

        .buttons {
            display: flex;
            flex-direction: row;
            gap: 0.75rem;
            width: 100%;
            margin-top: 3rem;
        }

        button {
            background: none;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.85rem;
            padding: 0.5rem 0.75rem;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-done {
            color: #4ade80;
            border-color: #4ade80;
            flex: 1;
        }

        .btn-postpone {
            color: #ef4444;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="title" id="title">Loading...</div>
        <div class="countdown" id="countdown"></div>
        <div class="scheduled" id="scheduled"></div>
        <div class="scheduled" id="snoozed" style="display:none"></div>
        <div class="buttons">
            <button class="btn-done" id="btn-done">Done</button>
            <button class="btn-postpone" id="postpone-10">+10m</button>
            <button class="btn-postpone" id="postpone-30">+30m</button>
            <button class="btn-postpone" id="postpone-60">+1h</button>
        </div>
    </div>

    <script>
        const box = document.querySelector('.box');
        window.addEventListener('mousemove', (e) => {
            const over = box.contains(document.elementFromPoint(e.clientX, e.clientY));
            if (window.electronAPI) {
                window.electronAPI.setIgnoreMouseEvents(!over, { forward: true });
            }
        });

        let currentTaskId = null;
        let countdownInterval = null;

        function renderCountdown(targetTime) {
            const msRemaining = targetTime - new Date();
            const el = document.getElementById('countdown');
            if (msRemaining <= 0) {
                const abs = Math.abs(msRemaining);
                const h = Math.floor(abs / 3600000);
                const m = Math.floor((abs % 3600000) / 60000);
                const s = Math.floor((abs % 60000) / 1000);
                el.textContent = h > 0
                    ? `Overdue by ${h}h ${m}m ${s}s`
                    : `Overdue by ${m}m ${s}s`;
            } else {
                const m = Math.floor(msRemaining / 60000);
                const s = Math.floor((msRemaining % 60000) / 1000);
                el.textContent = `In ${m}m ${s}s`;
            }
        }

        function formatScheduled(date) {
            return date.toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
        }

        function effectiveTime(r) {
            const next = new Date(r.nextOccurrence);
            if (r.snoozeUntil) {
                const snooze = new Date(r.snoozeUntil);
                if (snooze > next) return snooze;
            }
            return next;
        }

        if (window.electronAPI) {
            window.electronAPI.onUpdateReminders((data) => {
                currentTaskId = data.id;
                document.getElementById('title').innerText = data.title || 'Unknown Task';

                const target = effectiveTime(data);
                if (countdownInterval) clearInterval(countdownInterval);
                renderCountdown(target);
                countdownInterval = setInterval(() => renderCountdown(target), 1000);

                document.getElementById('scheduled').innerText =
                    `Scheduled: ${formatScheduled(new Date(data.nextOccurrence))}`;

                const snoozedEl = document.getElementById('snoozed');
                if (data.snoozeUntil) {
                    snoozedEl.innerText = `Snoozed to: ${formatScheduled(new Date(data.snoozeUntil))}`;
                    snoozedEl.style.display = '';
                } else {
                    snoozedEl.style.display = 'none';
                }
            });
        }

        document.getElementById('btn-done').addEventListener('click', async () => {
            document.getElementById('title').innerText = 'Marking as done...';
            if (currentTaskId) await window.electronAPI.markAsDone(currentTaskId);
        });

        const handlePostpone = async (mins) => {
            document.getElementById('title').innerText = 'Snoozing...';
            if (currentTaskId) await window.electronAPI.postpone(currentTaskId, mins);
        };

        document.getElementById('postpone-10').addEventListener('click', () => handlePostpone(10));
        document.getElementById('postpone-30').addEventListener('click', () => handlePostpone(30));
        document.getElementById('postpone-60').addEventListener('click', () => handlePostpone(60));
    </script>
</body>
</html>
