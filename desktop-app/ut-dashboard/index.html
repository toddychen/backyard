<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UT Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::-webkit-scrollbar { display: none; }

    body {
      background: transparent;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      overflow: hidden;
      padding: 0;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      height: 100vh;
      pointer-events: none;
      user-select: none;
    }

    .container {
      padding: 6px;
      pointer-events: auto;
      background: #000;
      border-radius: 12px;
    }

    #content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 120px;
    }

    .card {
      background: #111;
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid #222;
      width: 120px;
      box-sizing: border-box;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 5px;
    }

    .badges {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 6px;
    }

    .badge {
      font-size: 8px;
      font-weight: 700;
      padding: 2px 0;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      text-align: center;
      width: 100%;
    }

    .badge-offline { background: #c53030; color: #fff; }
    .badge-to-list { background: #9b2c2c; color: #fed7d7; }

    .label {
      font-size: 9px;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 1px;
    }

    .value-credit {
      font-size: 13px;
      font-weight: 600;
      color: #4fd1c5;
    }

    .value {
      font-size: 12px;
      font-weight: 500;
      color: #bbb;
    }

    .sub {
      font-size: 10px;
      color: #444;
      margin-left: 3px;
    }

    .sub-blue {
      font-size: 10px;
      color: #63b3ed;
      margin-left: 3px;
    }

    .stat-block {
      margin-bottom: 6px;
    }

    .row {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .error {
      font-size: 10px;
      color: #e53e3e;
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div id="content"></div>
  </div>
  <script src="renderer.js"></script>
  <script>
    const container = document.getElementById('container');
    window.addEventListener('mousemove', (e) => {
      const over = container.contains(document.elementFromPoint(e.clientX, e.clientY));
      if (window.dashboard) {
        window.dashboard.setIgnoreMouseEvents(!over, { forward: true });
      }
    });
  </script>
</body>
</html>
