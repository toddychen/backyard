<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UT Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::-webkit-scrollbar { display: none; }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      overflow: hidden;
      padding: 10px;
      display: inline-block;
      -webkit-app-region: drag;
      user-select: none;
    }

    #content {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .card {
      background: #111;
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid #222;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 5px;
    }

    .badges {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 6px;
    }

    .badge {
      font-size: 8px;
      font-weight: 700;
      padding: 2px 0;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      text-align: center;
      width: 100%;
    }

    .badge-offline { background: #c53030; color: #fff; }
    .badge-to-list { background: #9b2c2c; color: #fed7d7; }

    .label {
      font-size: 9px;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 1px;
    }

    .value-credit {
      font-size: 13px;
      font-weight: 600;
      color: #4fd1c5;
    }

    .value {
      font-size: 12px;
      font-weight: 500;
      color: #bbb;
    }

    .sub {
      font-size: 10px;
      color: #444;
      margin-left: 3px;
    }

    .sub-blue {
      font-size: 10px;
      color: #63b3ed;
      margin-left: 3px;
    }

    .stat-block {
      margin-bottom: 6px;
    }

    .row {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .error {
      font-size: 10px;
      color: #e53e3e;
    }
  </style>
</head>
<body>
  <div id="content"></div>
  <script src="renderer.js"></script>
</body>
</html>
