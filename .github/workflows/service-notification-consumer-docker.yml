name: service-notification-consumer-docker

on:
  push:
    branches:
      - main
    paths:
      - "services/notification-consumer/**"
      - "services/notification-common/**"
      - ".github/workflows/service-notification-consumer-docker.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TARGET_PLATFORMS: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar (skip tests)
        run: ./mvnw -f services/pom.xml -B -DskipTests package --pl notification-common,notification-consumer

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/notification-consumer
          file: services/notification-consumer/Dockerfile
          push: true
          platforms: ${{ env.TARGET_PLATFORMS }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/service-notification-consumer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
