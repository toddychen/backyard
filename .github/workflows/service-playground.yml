name: service-playground-ci

on:
  push:
    paths:
      - "services/playground/**"
      - ".github/workflows/service-playground.yml"
  pull_request:
    paths:
      - "services/playground/**"
      - ".github/workflows/service-playground.yml"

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: ./mvnw -f services/playground/pom.xml -B test

      - name: Test Report (JUnit)
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Tests
          path: services/playground/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-empty: "false"
          max-annotations: "50"
          use-actions-summary: "true"

