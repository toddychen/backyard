name: service-playground-docker

on:
  push:
    branches:
      - main
    paths:
      - "services/playground/**"
      - ".github/workflows/service-playground-docker.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TARGET_PLATFORMS: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install buf
        run: |
          curl -sSL https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64 \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf

      - name: Build jar (skip tests)
        env:
          BUF_TOKEN: ${{ secrets.BUF_API_TOKEN }}
          GOOGLE_LANGUAGE_API_KEY: ${{ secrets.GOOGLE_LANGUAGE_API_KEY }}
        run: ./mvnw -f services/pom.xml -B -DskipTests package --pl notification-common,playground

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Print build platforms
        run: echo "Building for platforms $TARGET_PLATFORMS"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/playground
          file: services/playground/Dockerfile
          push: true
          platforms: ${{ env.TARGET_PLATFORMS }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/service-playground:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update stage/prod image tags in git
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"

          python3 utils/update-helm-image-tag.py \
            --sha "${SHA}" \
            --file infra/helm/playground/values-stage.yaml \
            --file infra/helm/playground/values-prod.yaml

          if [[ -n "$(git status --porcelain)" ]]; then
            git add infra/helm/playground/values-stage.yaml infra/helm/playground/values-prod.yaml
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(playground): bump stage/prod image tag to ${SHA}"
            git push
          else
            echo "No changes to commit."
          fi

