name: service-collab-docker

on:
  push:
    branches:
      - main
    paths:
      - "node-services/collab/**"
      - ".github/workflows/service-collab-docker.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TARGET_PLATFORMS: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: node-services/collab
          file: node-services/collab/Dockerfile
          push: true
          platforms: ${{ env.TARGET_PLATFORMS }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/service-collab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
