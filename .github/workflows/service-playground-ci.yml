name: service-playground-ci

on:
  push:
    branches:
      - main
    paths:
      - "services/playground/**"
      - ".github/workflows/service-playground-ci.yml"
  pull_request:
    paths:
      - "services/playground/**"
      - ".github/workflows/service-playground-ci.yml"

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: playground
          MYSQL_USER: playground
          MYSQL_PASSWORD: playground-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # GitHub is deprecating the Node.js 20 runtime for actions; force Node.js 24 now to avoid warnings.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install buf
        run: |
          curl -sSL https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64 \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf
      - name: Test
        env:
          BUF_TOKEN: ${{ secrets.BUF_API_TOKEN }}
          GOOGLE_LANGUAGE_API_KEY: ${{ secrets.GOOGLE_LANGUAGE_API_KEY }}
        run: ./mvnw -f services/pom.xml -B test -Dspring.profiles.active=ci --pl notification-common,playground

      - name: Test Report (JUnit)
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Tests
          path: services/playground/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-empty: "false"
          max-annotations: "50"
          use-actions-summary: "true"

